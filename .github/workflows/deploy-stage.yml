name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  PROJECT_ID: nords-spatial-1776012153
  REGION: us-central1
  CLOUD_RUN_SERVICE: nords-engine-stage
  FIREBASE_TARGET: staging
  # VITE env vars injected from GitHub Actions secrets at build time
  VITE_FIREBASE_API_KEY: ${{ secrets.STG_VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: nords-spatial-1776012153.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: nords-spatial-1776012153
  VITE_FIREBASE_STORAGE_BUCKET: nords-spatial-1776012153.firebasestorage.app

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for WIF
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          docker build -f Dockerfile.server -t $IMAGE_NAME .
          docker push $IMAGE_NAME
          echo "IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --add-cloudsql-instances=nords-spatial-1776012153:us-central1:nords-db-main'
          env_vars: |
            NODE_ENV=staging
            DATABASE_URL=${{ secrets.STG_POSTGRES_URL }}
            JWT_SECRET=${{ secrets.STG_JWT_SECRET }}
            CORS_ORIGIN=https://nord-stage.monumental.ax

  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ secrets.STG_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ env.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ env.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ env.VITE_FIREBASE_STORAGE_BUCKET }}
        run: pnpm --filter client run build

      - name: Authenticate to GCP (for Firebase CLI)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Deploy to Firebase Hosting (Staging)
        run: firebase deploy --only hosting:${{ env.FIREBASE_TARGET }} --project ${{ env.PROJECT_ID }}
