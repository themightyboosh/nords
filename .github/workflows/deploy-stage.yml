name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  PROJECT_ID: nords-spatial-1776012153
  REGION: us-central1
  CLOUD_RUN_SERVICE: nords-engine-stage
  FIREBASE_TARGET: staging
  # VITE env vars injected from GitHub Actions secrets at build time
  VITE_FIREBASE_API_KEY: ${{ secrets.STG_VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: nords-spatial-1776012153.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: nords-spatial-1776012153
  VITE_FIREBASE_STORAGE_BUCKET: nords-spatial-1776012153.appspot.com

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for WIF
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build and Push Docker image
        working-directory: ./server
        run: |
          IMAGE_NAME="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          # We check if the repository exists, if not we fall back to gcr.io or create it.
          # For simplicity using GCR (Container Registry) natively supported by older projects.
          FALLBACK_IMAGE="gcr.io/${PROJECT_ID}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          docker build -t $FALLBACK_IMAGE .
          docker push $FALLBACK_IMAGE
          echo "IMAGE=$FALLBACK_IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          env_vars: |
            NODE_ENV=staging
            POSTGRES_URL=${{ secrets.STG_POSTGRES_URL }}
            JWT_SECRET=${{ secrets.STG_JWT_SECRET }}

  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Frontend
        working-directory: ./client
        run: npm run build

      - name: Authenticate to GCP (for Firebase CLI)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Deploy to Firebase Hosting (Staging)
        run: firebase deploy --only hosting:${{ env.FIREBASE_TARGET }} --project ${{ env.PROJECT_ID }}
