name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Dummy Firebase vars so env.ts doesn't crash during build/test
  VITE_FIREBASE_API_KEY: ci-test-key
  VITE_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: ci-test
  VITE_FIREBASE_STORAGE_BUCKET: ci-test.appspot.com
  VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  VITE_FIREBASE_APP_ID: "1:000000000000:web:abc123"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm ci
    - run: npm run lint
    - run: npx tsc --noEmit
    - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nords
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nords_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run E2E Tests
      run: npm run test:e2e
