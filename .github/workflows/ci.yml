name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - run: npm ci
    - run: npm run lint
    - run: npx tsc --noEmit
    - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nords
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nords_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run E2E Tests
      run: npm run test:e2e
