<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nords — Login Background Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e1a;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    width: 100vw;
    height: 100vh;
  }

  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Login card overlay — just to preview context */
  .login-card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    width: 380px;
    padding: 48px 40px;
    background: rgba(14, 18, 32, 0.75);
    backdrop-filter: blur(40px) saturate(1.2);
    -webkit-backdrop-filter: blur(40px) saturate(1.2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    box-shadow: 0 32px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
    text-align: center;
    color: #e2e8f0;
  }

  .login-card h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .login-card p {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 32px;
  }

  .login-card button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #7c3aed);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: 0.01em;
  }

  .login-card button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
  }
</style>
</head>
<body>

<svg id="bg" xmlns="http://www.w3.org/2000/svg">
  <defs></defs>
</svg>

<div class="login-card">
  <h1>Nords</h1>
  <p>Map Knowledge. Wire Meaning. Deliver Expertise.</p>
  <button>Sign in with Google</button>
</div>

<script>
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════

const NUM_CARDS = 36;
const NUM_CONNECTIONS = 20;
const NUM_LOOSE_LINES = 14;       // Independent lines extending off-screen
const MAX_SPEED = 0.25;
const MIN_SPEED = 0.06;
const RECONNECT_INTERVAL = 3500;
const COLLISION_PADDING = 10;
const BLEED = 260;                // How far elements can extend beyond viewport

// Card size ranges — some quite large for prominent cropping
const CARD_MIN_W = 110;
const CARD_MAX_W = 260;
const CARD_MIN_H = 50;
const CARD_MAX_H = 120;
const CARD_R = 6;

// Solid fills — dark tones only, no text, no accent decorations
const CARD_FILLS = [
  '#111827', '#131b2e', '#161e30', '#0f1625', '#141c2c',
  '#10172a', '#171f34', '#0e1422',
];
const CARD_STROKES = [
  '#1e2844', '#1a2440', '#222e4e', '#1c2640',
];

const PALETTE = [
  '#3B82F6', '#8B5CF6', '#10B981', '#EF4444',
  '#F59E0B', '#6366F1', '#14B8A6', '#F97316',
  '#EC4899', '#06B6D4',
];

// ═══════════════════════════════════════════
// SVG SETUP
// ═══════════════════════════════════════════

const svg = document.getElementById('bg');
const NS = 'http://www.w3.org/2000/svg';
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  svg.setAttribute('viewBox', `${-BLEED} ${-BLEED} ${W + BLEED * 2} ${H + BLEED * 2}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
}
resize();
window.addEventListener('resize', resize);

function el(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rand(lo, hi) { return lo + Math.random() * (hi - lo); }

// Background gradient
const bgGrad = el('linearGradient', { id: 'bgGrad', x1: '0%', y1: '0%', x2: '100%', y2: '100%' });
bgGrad.appendChild(el('stop', { offset: '0%', 'stop-color': '#080c18' }));
bgGrad.appendChild(el('stop', { offset: '50%', 'stop-color': '#0d1224' }));
bgGrad.appendChild(el('stop', { offset: '100%', 'stop-color': '#080c18' }));
svg.querySelector('defs').appendChild(bgGrad);
svg.appendChild(el('rect', { x: -BLEED, y: -BLEED, width: W + BLEED * 2, height: H + BLEED * 2, fill: 'url(#bgGrad)' }));

// Dot grid
const dotPat = el('pattern', { id: 'dots', x: 0, y: 0, width: 40, height: 40, patternUnits: 'userSpaceOnUse' });
dotPat.appendChild(el('circle', { cx: 20, cy: 20, r: 0.6, fill: '#1e293b', opacity: 0.5 }));
svg.querySelector('defs').appendChild(dotPat);
svg.appendChild(el('rect', { x: -BLEED, y: -BLEED, width: W + BLEED * 2, height: H + BLEED * 2, fill: 'url(#dots)' }));

// Vignette — strong edges to fade the cropped elements
const vigGrad = el('radialGradient', { id: 'vig', cx: '50%', cy: '50%', r: '70%' });
vigGrad.appendChild(el('stop', { offset: '0%', 'stop-color': '#080c18', 'stop-opacity': 0 }));
vigGrad.appendChild(el('stop', { offset: '55%', 'stop-color': '#080c18', 'stop-opacity': 0.15 }));
vigGrad.appendChild(el('stop', { offset: '100%', 'stop-color': '#080c18', 'stop-opacity': 0.88 }));
svg.querySelector('defs').appendChild(vigGrad);

// Layers
const lineLayer = el('g', { id: 'loose-lines' });
const connLayer = el('g', { id: 'connections' });
const cardLayer = el('g', { id: 'cards' });
const vigRect = el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#vig)', 'pointer-events': 'none' });
svg.appendChild(lineLayer);
svg.appendChild(connLayer);
svg.appendChild(cardLayer);
svg.appendChild(vigRect);

// Arrow markers
PALETTE.forEach((color, i) => {
  const marker = el('marker', {
    id: `arrow-${i}`,
    viewBox: '0 0 10 10',
    refX: 10, refY: 5,
    markerWidth: 6, markerHeight: 6,
    orient: 'auto-start-reverse',
  });
  marker.appendChild(el('path', { d: 'M 0 1.5 L 10 5 L 0 8.5 z', fill: color, opacity: 0.5 }));
  svg.querySelector('defs').appendChild(marker);
});

// ═══════════════════════════════════════════
// LOOSE LINES — extend beyond screen borders
// ═══════════════════════════════════════════

class LooseLine {
  constructor() {
    this.color = pick(PALETTE);
    this.baseOpacity = rand(0.06, 0.18);
    this.phase = Math.random() * Math.PI * 2;

    // Pick random start/end ensuring the line crosses or touches viewport edges
    // Strategy: one point inside, one point far outside — or both crossing
    const edge = Math.floor(Math.random() * 4); // 0=top, 1=right, 2=bottom, 3=left
    const FAR = 400; // how far past viewport

    switch (edge) {
      case 0: // starts from beyond top
        this.x1 = rand(-FAR, W + FAR);
        this.y1 = rand(-FAR, -40);
        this.x2 = rand(-FAR * 0.3, W + FAR * 0.3);
        this.y2 = rand(H * 0.3, H + FAR);
        break;
      case 1: // starts from beyond right
        this.x1 = rand(W + 40, W + FAR);
        this.y1 = rand(-FAR, H + FAR);
        this.x2 = rand(-FAR, W * 0.7);
        this.y2 = rand(-FAR * 0.3, H + FAR * 0.3);
        break;
      case 2: // starts from beyond bottom
        this.x1 = rand(-FAR, W + FAR);
        this.y1 = rand(H + 40, H + FAR);
        this.x2 = rand(-FAR * 0.3, W + FAR * 0.3);
        this.y2 = rand(-FAR, H * 0.7);
        break;
      case 3: // starts from beyond left
        this.x1 = rand(-FAR, -40);
        this.y1 = rand(-FAR, H + FAR);
        this.x2 = rand(W * 0.3, W + FAR);
        this.y2 = rand(-FAR * 0.3, H + FAR * 0.3);
        break;
    }

    // Slight drift
    const angle = Math.random() * Math.PI * 2;
    const speed = rand(0.02, 0.08);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;

    this.line = el('line', {
      x1: this.x1, y1: this.y1,
      x2: this.x2, y2: this.y2,
      stroke: this.color,
      'stroke-width': rand(0.5, 1.5),
      'stroke-linecap': 'round',
      opacity: 0,
    });
    lineLayer.appendChild(this.line);
  }

  update() {
    this.x1 += this.vx;
    this.y1 += this.vy;
    this.x2 += this.vx;
    this.y2 += this.vy;
    this.phase += 0.003;
  }

  render(t) {
    const shimmer = this.baseOpacity + Math.sin(this.phase + t * 0.0006) * (this.baseOpacity * 0.5);
    this.line.setAttribute('x1', this.x1.toFixed(1));
    this.line.setAttribute('y1', this.y1.toFixed(1));
    this.line.setAttribute('x2', this.x2.toFixed(1));
    this.line.setAttribute('y2', this.y2.toFixed(1));
    this.line.setAttribute('opacity', Math.max(0, shimmer).toFixed(3));
  }
}

// ═══════════════════════════════════════════
// CARD ENTITIES — dark solid rectangles only
// ═══════════════════════════════════════════

class Card {
  constructor(i, forceEdge = false) {
    this.id = i;
    this.colorIdx = i % PALETTE.length;

    // Varied sizes — some are large blocks
    this.w = rand(CARD_MIN_W, CARD_MAX_W);
    this.h = rand(CARD_MIN_H, CARD_MAX_H);

    if (forceEdge) {
      // Deliberately spawn overlapping a viewport edge for the "cropped" look
      this._spawnOnEdge();
    } else {
      this.x = rand(-BLEED, W + BLEED - this.w);
      this.y = rand(-BLEED, H + BLEED - this.h);

      // Avoid dead center (login card area)
      let tries = 0;
      while (this._inCenter() && tries++ < 30) {
        this.x = rand(-BLEED, W + BLEED - this.w);
        this.y = rand(-BLEED, H + BLEED - this.h);
      }
    }

    const angle = Math.random() * Math.PI * 2;
    const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.phase = Math.random() * Math.PI * 2;

    this._buildSVG();
  }

  _spawnOnEdge() {
    const edge = Math.floor(Math.random() * 4);
    switch (edge) {
      case 0: // top edge — partially above viewport
        this.x = rand(-this.w * 0.3, W - this.w * 0.7);
        this.y = rand(-this.h * 0.8, -this.h * 0.2);
        break;
      case 1: // right edge — partially off right
        this.x = rand(W - this.w * 0.6, W + this.w * 0.3);
        this.y = rand(-this.h * 0.3, H - this.h * 0.7);
        break;
      case 2: // bottom edge — partially below viewport
        this.x = rand(-this.w * 0.3, W - this.w * 0.7);
        this.y = rand(H - this.h * 0.6, H + this.h * 0.3);
        break;
      case 3: // left edge — partially off left
        this.x = rand(-this.w * 0.7, -this.w * 0.1);
        this.y = rand(-this.h * 0.3, H - this.h * 0.7);
        break;
    }
  }

  _inCenter() {
    const cx = this.x + this.w / 2;
    const cy = this.y + this.h / 2;
    return Math.abs(cx - W / 2) < 260 && Math.abs(cy - H / 2) < 200;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }

  _buildSVG() {
    this.group = el('g');

    // Pure dark solid rectangle — no text, no accent lines
    this.rect = el('rect', {
      width: this.w,
      height: this.h,
      rx: CARD_R,
      ry: CARD_R,
      fill: pick(CARD_FILLS),
      stroke: pick(CARD_STROKES),
      'stroke-width': 1,
    });
    this.group.appendChild(this.rect);

    cardLayer.appendChild(this.group);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    // Bounce off extended bleed boundaries
    if (this.x < -BLEED) { this.x = -BLEED; this.vx = Math.abs(this.vx); }
    if (this.x + this.w > W + BLEED) { this.x = W + BLEED - this.w; this.vx = -Math.abs(this.vx); }
    if (this.y < -BLEED) { this.y = -BLEED; this.vy = Math.abs(this.vy); }
    if (this.y + this.h > H + BLEED) { this.y = H + BLEED - this.h; this.vy = -Math.abs(this.vy); }

    this.phase += 0.005;
  }

  render(t) {
    const shimmer = 0.55 + Math.sin(this.phase + t * 0.0007) * 0.35;
    this.group.setAttribute('transform', `translate(${this.x.toFixed(1)},${this.y.toFixed(1)})`);
    this.group.setAttribute('opacity', shimmer.toFixed(3));
  }
}

// ═══════════════════════════════════════════
// CONNECTIONS
// ═══════════════════════════════════════════

class Connection {
  constructor(src, tgt) {
    this.src = src;
    this.tgt = tgt;
    this.colorIdx = cards[src].colorIdx;
    this.color = PALETTE[cards[src].colorIdx];
    this.birth = performance.now();
    this.fadeOut = null;
    this.dead = false;
    this.dashPhase = Math.random() * 200;

    this.path = el('path', {
      fill: 'none',
      stroke: this.color,
      'stroke-width': 1,
      'stroke-dasharray': '5,4',
      'stroke-linecap': 'round',
      'marker-end': `url(#arrow-${this.colorIdx})`,
      opacity: 0,
    });
    connLayer.appendChild(this.path);
  }

  get opacity() {
    const age = performance.now() - this.birth;
    const fadeIn = Math.min(1, age / 1000);
    if (this.fadeOut !== null) {
      const dying = (performance.now() - this.fadeOut) / 800;
      if (dying >= 1) { this.dead = true; return 0; }
      return (1 - dying) * fadeIn;
    }
    return fadeIn;
  }

  kill() { if (this.fadeOut === null) this.fadeOut = performance.now(); }
  remove() { this.path.remove(); }

  render() {
    const op = this.opacity * 0.25;
    if (op < 0.005) { if (this.dead) this.remove(); return; }

    const a = cards[this.src];
    const b = cards[this.tgt];
    const [sx, sy] = edgePoint(a, b);
    const [tx, ty] = edgePoint(b, a);

    const mx = (sx + tx) / 2 + (sy - ty) * 0.1;
    const my = (sy + ty) / 2 + (tx - sx) * 0.1;

    this.dashPhase -= 0.2;
    this.path.setAttribute('d', `M${sx.toFixed(1)},${sy.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)}`);
    this.path.setAttribute('opacity', op.toFixed(3));
    this.path.setAttribute('stroke-dashoffset', this.dashPhase.toFixed(1));
  }
}

function edgePoint(from, toward) {
  const dx = toward.cx - from.cx;
  const dy = toward.cy - from.cy;
  const hw = from.w / 2;
  const hh = from.h / 2;

  if (Math.abs(dx) / hw > Math.abs(dy) / hh) {
    const ex = dx > 0 ? from.x + from.w : from.x;
    const ey = from.cy + (dy / Math.abs(dx)) * hw * 0.5;
    return [ex, clamp(ey, from.y + 4, from.y + from.h - 4)];
  } else {
    const ey = dy > 0 ? from.y + from.h : from.y;
    const ex = from.cx + (dx / Math.abs(dy)) * hh * 0.5;
    return [clamp(ex, from.x + 4, from.x + from.w - 4), ey];
  }
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ═══════════════════════════════════════════
// PHYSICS
// ═══════════════════════════════════════════

function resolveCollisions() {
  for (let i = 0; i < cards.length; i++) {
    for (let j = i + 1; j < cards.length; j++) {
      const a = cards[i], b = cards[j];
      const pad = COLLISION_PADDING;
      const ox = (a.x + a.w + pad) - b.x;
      const oxr = (b.x + b.w + pad) - a.x;
      const oy = (a.y + a.h + pad) - b.y;
      const oyb = (b.y + b.h + pad) - a.y;

      if (ox > 0 && oxr > 0 && oy > 0 && oyb > 0) {
        const mx = Math.min(ox, oxr);
        const my = Math.min(oy, oyb);
        if (mx < my) {
          const push = mx / 2 + 0.3;
          if (a.cx < b.cx) { a.x -= push; b.x += push; a.vx = -Math.abs(a.vx) * 0.85; b.vx = Math.abs(b.vx) * 0.85; }
          else { a.x += push; b.x -= push; a.vx = Math.abs(a.vx) * 0.85; b.vx = -Math.abs(b.vx) * 0.85; }
        } else {
          const push = my / 2 + 0.3;
          if (a.cy < b.cy) { a.y -= push; b.y += push; a.vy = -Math.abs(a.vy) * 0.85; b.vy = Math.abs(b.vy) * 0.85; }
          else { a.y += push; b.y -= push; a.vy = Math.abs(a.vy) * 0.85; b.vy = -Math.abs(b.vy) * 0.85; }
        }
        ensureSpeed(a); ensureSpeed(b);
      }
    }
  }
}

function ensureSpeed(c) {
  const s = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
  if (s < MIN_SPEED && s > 0.001) { c.vx = (c.vx / s) * MIN_SPEED; c.vy = (c.vy / s) * MIN_SPEED; }
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════

const cards = [];
// ~40% of cards are forced to spawn at viewport edges for the cropped look
for (let i = 0; i < NUM_CARDS; i++) {
  const forceEdge = i < Math.ceil(NUM_CARDS * 0.4);
  cards.push(new Card(i, forceEdge));
}

// Loose lines — independent geometric lines extending off-screen
const looseLines = [];
for (let i = 0; i < NUM_LOOSE_LINES; i++) {
  looseLines.push(new LooseLine());
}

let connections = [];
function addRandomConnection() {
  const src = Math.floor(Math.random() * NUM_CARDS);
  let tgt; do { tgt = Math.floor(Math.random() * NUM_CARDS); } while (tgt === src);
  if (!connections.some(c => !c.dead && c.src === src && c.tgt === tgt)) {
    connections.push(new Connection(src, tgt));
  }
}
for (let i = 0; i < NUM_CONNECTIONS; i++) addRandomConnection();

setInterval(() => {
  const living = connections.filter(c => !c.dead && c.fadeOut === null);
  if (living.length > 10) living[Math.floor(Math.random() * living.length)].kill();
  addRandomConnection();
}, RECONNECT_INTERVAL);

// ═══════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════

function frame(t) {
  for (const c of cards) { c.update(); c.render(t); }
  for (const l of looseLines) { l.update(); l.render(t); }
  resolveCollisions();
  connections = connections.filter(c => { if (c.dead) { c.remove(); return false; } return true; });
  for (const c of connections) c.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
