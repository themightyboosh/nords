version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: nords
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nords_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nords -d nords_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
